name: landing-release
# Ported from the retired flick-landing repo — the marketing site now lives in
# landing/. Tag `landing-v*` to cut a release; the quadlet on the prod box
# tracks ghcr.io/one-more-refactor/flick-landing:latest via podman-auto-update.
on:
  push:
    tags: ["landing-v*"]
permissions:
  contents: write
env:
  IMAGE: ghcr.io/one-more-refactor/flick-landing
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Tag matches package version
        working-directory: landing
        run: |
          TAG="${GITHUB_REF_NAME#landing-v}"
          V=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$V" != "$TAG" ]; then
            echo "::error file=landing/package.json::version is $V but tag is landing-v$TAG — bump the manifest first"
            exit 1
          fi
      - run: bun install --frozen-lockfile
        working-directory: landing
      - run: bun run build
        working-directory: landing
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

  # Build the production image for both arches on NATIVE runners and push each
  # by digest. The prod box is arm64; CI is amd64 — QEMU emulation would make
  # the build crawl, so we use GitHub's arm64 runners instead (free on public
  # repos). The two digests are joined into one manifest list by the next job,
  # so `podman pull` resolves the right arch automatically.
  image:
    needs: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: landing
          file: landing/deploy/Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=landing-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=landing-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the per-arch digests into a single multi-arch tag. `:latest` is what
  # the quadlet tracks for podman-auto-update; the version tag is the rollback
  # target if a release turns out bad.
  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          VERSION="${GITHUB_REF_NAME#landing-}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:latest"
